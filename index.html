<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- [DÜZENLE] Tarayıcı sekmesinde görünecek sayfa başlığı -->
    <title>Kişisel Bağlantılar</title>
    
    <!-- Modern Yazı Tipi (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- İkon Kütüphanesi (FontAwesome 6.5.2 - Güncel Sürüm) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* ==========================================================================
           1. RENK PALETİ VE TEMEL AYARLAR
           [DÜZENLE] Sitenin ana renklerini buradaki kodları değiştirerek ayarlayabilirsiniz.
           ========================================================================== */
        :root {
            --bg-base: #0b132b;           /* Ana zemin rengi (Ferah derin lacivert) */
            --orb-1: #00b4d8;             /* 1. Hareketli ışık küresi (Canlı Turkuaz/Mavi) */
            --orb-2: #6366f1;             /* 2. Hareketli ışık küresi (Modern İndigo) */
            --orb-3: #10b981;             /* 3. Hareketli ışık küresi (Zümrüt/Su Yeşili) */
            --card-bg: rgba(255, 255, 255, 0.06); /* Buton içi buzlu cam rengi */
            --card-border: rgba(255, 255, 255, 0.14); /* Buton çerçeve rengi */
            --card-hover: rgba(255, 255, 255, 0.12);  /* Buton üzerine gelince oluşan renk */
            --text-primary: #ffffff;      /* Ana yazı rengi */
            --text-secondary: #cbd5e1;    /* Alt başlık ve ikincil yazı rengi */
            --accent-color: #38bdf8;      /* İkon ve vurgu rengi */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           2. ANİMASYONLU ARKA PLAN (Aurora Işıkları + Mikro Izgara)
           ========================================================================== */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* İçeriğin arkasında, ana zeminin önünde durur */
            overflow: hidden;
            background: linear-gradient(-45deg, #0b132b, #1c2541, #0f172a, #1e1b4b);
            background-size: 400% 400%;
            animation: gradientFlow 18s ease infinite;
        }

        /* Arka plan üzerindeki modern teknik ızgara dokusu */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            pointer-events: none;
        }

        /* Yüzen ışık küreleri (Mobil ve masaüstü donanım hızlandırmalı) */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            -webkit-filter: blur(70px);
            opacity: 0.55;
            will-change: transform;
        }

        .orb-1 {
            width: 380px;
            height: 380px;
            background: var(--orb-1);
            top: -10%;
            left: -10%;
            animation: moveOrb1 14s infinite alternate ease-in-out;
        }

        .orb-2 {
            width: 340px;
            height: 340px;
            background: var(--orb-2);
            bottom: -10%;
            right: -10%;
            animation: moveOrb2 18s infinite alternate ease-in-out;
        }

        .orb-3 {
            width: 260px;
            height: 260px;
            background: var(--orb-3);
            top: 40%;
            left: 55%;
            opacity: 0.35;
            animation: moveOrb3 16s infinite alternate ease-in-out;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes moveOrb1 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(120px, 80px, 0) scale(1.15); }
        }

        @keyframes moveOrb2 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-120px, -90px, 0) scale(1.1); }
        }

        @keyframes moveOrb3 {
            0% { transform: translate3d(-80px, -40px, 0) scale(0.9); }
            100% { transform: translate3d(60px, 70px, 0) scale(1.2); }
        }

        /* ==========================================================================
           3. ANA KART VE PROFİL ALANI
           ========================================================================== */
        .container {
            width: 100%;
            max-width: 440px;
            padding: 45px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .profile-wrapper {
            position: relative;
            margin-bottom: 20px;
            animation: fadeDown 0.8s ease forwards;
        }

        .profile-pic {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 2;
            background-color: #1e293b;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* Profil etrafındaki dönen halka */
        .profile-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, var(--orb-1), var(--orb-2), var(--orb-3), var(--orb-1));
            border-radius: 50%;
            z-index: 1;
            background-size: 300% 300%;
            animation: gradientFlow 6s linear infinite;
        }

        .profile-name {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            text-align: center;
            opacity: 0;
            animation: fadeDown 0.8s ease forwards 0.15s;
        }

        .profile-bio {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 35px;
            min-height: 22px;
            text-align: center;
            opacity: 0;
            animation: fadeDown 0.8s ease forwards 0.3s;
        }

        /* Daktilo imleci animasyonu */
        .profile-bio::after {
            content: '|';
            margin-left: 3px;
            color: var(--accent-color);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==========================================================================
           4. BAĞLANTI BUTONLARI (Buzlu Cam & Parlama Efekti)
           ========================================================================== */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            perspective: 1000px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 22px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            
            /* Sıralı açılış animasyonu */
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease forwards;
        }

        .link-btn:nth-child(1) { animation-delay: 0.4s; }
        .link-btn:nth-child(2) { animation-delay: 0.5s; }
        .link-btn:nth-child(3) { animation-delay: 0.6s; }
        .link-btn:nth-child(4) { animation-delay: 0.7s; }
        .link-btn:nth-child(5) { animation-delay: 0.8s; }

        /* Buton üzerinden geçen ışık yansıması */
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.12), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
        }

        .link-btn:hover::before {
            left: 150%;
        }

        .link-btn i {
            font-size: 1.3rem;
            color: var(--accent-color);
            width: 36px;
            text-align: center;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .link-btn span {
            flex-grow: 1;
            text-align: center;
            padding-right: 36px; /* İkon genişliğini dengeleyerek metni tam ortalar */
        }

        .link-btn:hover {
            background: var(--card-hover);
            border-color: rgba(56, 189, 248, 0.45);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25), 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .link-btn:hover i {
            color: #ffffff;
            transform: scale(1.15);
        }

        /* ==========================================================================
           5. SOSYAL MEDYA VE ALT BİLGİ (FOOTER)
           ========================================================================== */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-top: 35px;
            opacity: 0;
            animation: slideUp 0.6s ease forwards 0.9s;
        }

        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            text-decoration: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            color: var(--text-primary);
            background: var(--card-hover);
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.25);
        }

        .footer-text {
            margin-top: 28px;
            font-size: 0.8rem;
            color: rgba(203, 213, 225, 0.45);
            opacity: 0;
            animation: fadeDown 0.8s ease forwards 1s;
        }

        /* Giriş Animasyonları */
        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobil Ekran İyileştirmeleri */
        @media screen and (max-width: 480px) {
            .container {
                padding: 35px 18px;
            }
            .orb-1 { width: 260px; height: 260px; }
            .orb-2 { width: 240px; height: 240px; }
            .orb-3 { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>

    <!-- ARKA PLAN KATMANI -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- ANA İÇERİK KUTUSU -->
    <main class="container">
        
        <!-- [DÜZENLE] PROFİL FOTOĞRAFI: src="" kısmına kendi görselinizin yolunu (örn: images/profil.jpg) yazın -->
        <div class="profile-wrapper">
            <img src="https://ui-avatars.com/api/?name=BY&background=0f172a&color=38bdf8&size=200&font-size=0.4&bold=true" alt="Profil" class="profile-pic">
        </div>
        
        <!-- [DÜZENLE] İSİM / BAŞLIK ALANI -->
        <h1 class="profile-name">Batu Yılmaz</h1>
        
        <!-- Alt metin alanı (Aşağıdaki script bölümünden otomatik yazdırılır) -->
        <div class="profile-bio" id="typewriter"></div>

        <!-- [DÜZENLE] BAĞLANTI BUTONLARI: href="" kısımlarına yönlendirmek istediğiniz adresleri yazın -->
        <div class="links-wrapper">
            
            <a href="#" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-globe"></i>
                <span>Kişisel Web Sitem</span>
            </a>

            <a href="#" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-diagram-project"></i>
                <span>Nostratic Numbers</span>
            </a>

            <a href="#" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-github"></i>
                <span>GitHub Projeleri</span>
            </a>

            <a href="#" class="link-btn" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-feather"></i>
                <span>Outis</span>
            </a>

            <a href="mailto:ornek@alanadi.com" class="link-btn">
                <i class="fa-solid fa-envelope"></i>
                <span>İletişim</span>
            </a>

        </div>

        <!-- [DÜZENLE] SOSYAL MEDYA İKONLARI (İstemediğinizi silebilir veya yenisini ekleyebilirsiniz) -->
        <div class="social-icons">
            <a href="#" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="X">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
        </div>

        <!-- [DÜZENLE] ALT BİLGİ -->
        <div class="footer-text">
            © 2026 Tüm hakları saklıdır.
        </div>

    </main>

    <!-- ETKİLEŞİM SCRIPTİ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // [DÜZENLE] İsim altında harf harf yazılacak metni buradan değiştirebilirsiniz:
            const bioText = "Projeler & Kişisel Bağlantılar";
            const typeTarget = document.getElementById('typewriter');
            let index = 0;

            setTimeout(() => {
                function typeEffect() {
                    if (index < bioText.length) {
                        typeTarget.textContent += bioText.charAt(index);
                        index++;
                        setTimeout(typeEffect, 55);
                    }
                }
                typeEffect();
            }, 900);

            // 3D Buton Eğim Efekti (Sadece fare kullanılan cihazlarda devreye girer, mobilde takılmaz)
            if (window.matchMedia("(hover: hover)").matches) {
                const buttons = document.querySelectorAll('.link-btn');

                buttons.forEach(btn => {
                    btn.addEventListener('mousemove', (e) => {
                        const rect = btn.getBoundingClientRect();
                        const x = e.clientX - rect.left - rect.width / 2;
                        const y = e.clientY - rect.top - rect.height / 2;
                        
                        const tiltX = (y / rect.height) * -12;
                        const tiltY = (x / rect.width) * 12;

                        btn.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale3d(1.02, 1.02, 1.02)`;
                    });

                    btn.addEventListener('mouseleave', () => {
                        btn.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                    });
                });
            }
        });
    </script>

</body>
</html>
