<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B5N7JLQ6DZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-B5N7JLQ6DZ');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    
    <!-- [DÜZENLE] Tarayıcı sekmesinde görünecek başlık -->
    <title>Batu Yılmaz | btylmz</title>
    
    <!-- Modern Yazı Tipi (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- İkon Kütüphanesi (FontAwesome 6.5.2) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* ==========================================================================
           1. RENK PALETİ VE TEMEL AYARLAR
           [DÜZENLE] Renk tonlarını buradan değiştirebilirsiniz.
           ========================================================================== */
        :root {
            --bg-base: #090f24;
            --orb-1: #00b4d8;
            --orb-2: #6366f1;
            --orb-3: #10b981;
            --main-card-bg: rgba(15, 23, 42, 0.45);
            --main-card-border: rgba(255, 255, 255, 0.1);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-border: rgba(255, 255, 255, 0.12);
            --btn-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --youtube-color: #ff0033;
            --spotify-color: #1db954;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; /* Mobilde tıklama mavisini kaldırır */
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh; /* Mobil tarayıcı adres çubuğuna tam uyum */
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           2. ANİMASYONLU ARKA PLAN (Aurora Işıkları + Mikro Izgara)
           ========================================================================== */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(-45deg, #090f24, #16203a, #0b132b, #1b1742);
            background-size: 400% 400%;
            animation: gradientFlow 18s ease infinite;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 1;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: radial-gradient(circle at center, black 45%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 95%);
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(75px);
            -webkit-filter: blur(75px);
            opacity: 0.5;
            will-change: transform;
        }

        .orb-1 {
            width: 360px;
            height: 360px;
            background: var(--orb-1);
            top: -8%;
            left: -8%;
            animation: moveOrb1 14s infinite alternate ease-in-out;
        }

        .orb-2 {
            width: 340px;
            height: 340px;
            background: var(--orb-2);
            bottom: -8%;
            right: -8%;
            animation: moveOrb2 18s infinite alternate ease-in-out;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--orb-3);
            top: 42%;
            left: 52%;
            opacity: 0.3;
            animation: moveOrb3 16s infinite alternate ease-in-out;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes moveOrb1 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(100px, 70px, 0) scale(1.15); }
        }

        @keyframes moveOrb2 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-100px, -80px, 0) scale(1.1); }
        }

        @keyframes moveOrb3 {
            0% { transform: translate3d(-60px, -30px, 0) scale(0.9); }
            100% { transform: translate3d(50px, 60px, 0) scale(1.2); }
        }

        /* ==========================================================================
           3. BUZLU CAM KARTVİZİT KONTEYNERİ VE PROFİL
           ========================================================================== */
        .card-container {
            width: 100%;
            max-width: 400px;
            padding: 44px 28px 36px 28px;
            background: var(--main-card-bg);
            border: 1px solid var(--main-card-border);
            border-top: 1px solid rgba(255, 255, 255, 0.22); /* Üst ışık kırılması */
            border-radius: 28px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .profile-wrapper {
            position: relative;
            margin-bottom: 18px;
        }

        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(15, 23, 42, 0.8);
            position: relative;
            z-index: 2;
            background-color: #0f172a;
            display: block;
        }

        /* Dönen neon profil çerçevesi */
        .profile-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, var(--orb-1), var(--orb-2), var(--orb-3), var(--orb-1));
            border-radius: 50%;
            z-index: 1;
            background-size: 300% 300%;
            animation: gradientFlow 6s linear infinite;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
        }

        .profile-name {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.4px;
            text-align: center;
        }

        .profile-bio {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 32px;
            min-height: 22px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .profile-bio::after {
            content: '|';
            margin-left: 3px;
            color: var(--accent-color);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ==========================================================================
           4. BAĞLANTI BUTONLARI ("Ben" ve "İletişim")
           ========================================================================== */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            perspective: 1000px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 17px 20px;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            border-radius: 16px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
            
            opacity: 0;
            transform: translateY(15px);
            animation: slideUp 0.5s ease forwards;
        }

        .link-btn:nth-child(1) { animation-delay: 0.25s; }
        .link-btn:nth-child(2) { animation-delay: 0.35s; }

        /* Parlama yansıması */
        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.12), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
        }

        .link-btn:hover::before {
            left: 150%;
        }

        /* Sol İkon */
        .btn-icon-left {
            font-size: 1.2rem;
            color: var(--accent-color);
            width: 28px;
            text-align: center;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        /* Ortadaki Metin */
        .link-btn span {
            flex-grow: 1;
            text-align: center;
            letter-spacing: 0.2px;
        }

        /* Sağ Yönlendirme Oku */
        .btn-icon-right {
            font-size: 0.85rem;
            color: var(--text-secondary);
            width: 28px;
            text-align: center;
            opacity: 0.5;
            transition: transform 0.3s ease, opacity 0.3s ease, color 0.3s ease;
        }

        .link-btn:hover {
            background: var(--btn-hover);
            border-color: rgba(56, 189, 248, 0.45);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25), 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .link-btn:hover .btn-icon-left {
            color: #ffffff;
            transform: scale(1.12);
        }

        .link-btn:hover .btn-icon-right {
            opacity: 1;
            color: var(--accent-color);
            transform: translateX(4px);
        }

        /* Mobil dokunma hissi */
        .link-btn:active {
            transform: scale(0.97) !important;
        }

        /* ==========================================================================
           5. YUVARLAK YOUTUBE & SPOTIFY İKON YUVALARI
           ========================================================================== */
        .social-icons {
            display: flex;
            gap: 18px;
            margin-top: 32px;
            opacity: 0;
            animation: slideUp 0.5s ease forwards 0.45s;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* YouTube Özel Parlama */
        .social-icon.youtube:hover {
            color: #ffffff;
            background: rgba(255, 0, 51, 0.15);
            border-color: var(--youtube-color);
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 0, 51, 0.35);
        }

        /* Spotify Özel Parlama */
        .social-icon.spotify:hover {
            color: #ffffff;
            background: rgba(29, 185, 84, 0.15);
            border-color: var(--spotify-color);
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.35);
        }

        .social-icon:active {
            transform: scale(0.93);
        }

        .footer-text {
            margin-top: 28px;
            font-size: 0.78rem;
            color: rgba(148, 163, 184, 0.45);
            text-align: center;
            opacity: 0;
            animation: slideUp 0.5s ease forwards 0.55s;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           6. MOBİL EKRAN UYUMLULUĞU (Responsive)
           ========================================================================== */
        @media screen and (max-width: 480px) {
            body {
                padding: 16px;
            }
            .card-container {
                padding: 36px 20px 30px 20px;
                border-radius: 24px;
            }
            .profile-pic {
                width: 100px;
                height: 100px;
            }
            .profile-name {
                font-size: 1.5rem;
            }
            .link-btn {
                padding: 16px 18px;
                font-size: 0.96rem;
            }
            .orb-1 { width: 240px; height: 240px; }
            .orb-2 { width: 220px; height: 220px; }
            .orb-3 { width: 160px; height: 160px; }
        }
    </style>
</head>
<body>

    <!-- ARKA PLAN KATMANI -->
    <div class="animated-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- ANA KARTVİZİT KUTUSU -->
    <main class="card-container">
        
        <!-- [DÜZENLE] PROFİL FOTOĞRAFI: src="" kısmına kendi görsel yolunuzu yazabilirsiniz -->
        <div class="profile-wrapper">
            <img src="https://ui-avatars.com/api/?name=BY&background=0f172a&color=38bdf8&size=200&font-size=0.4&bold=true" alt="Batu Yılmaz" class="profile-pic">
        </div>
        
        <!-- [DÜZENLE] İSİM ALANI -->
        <h1 class="profile-name">Batu Yılmaz</h1>
        
        <!-- Alt metin (Aşağıdaki script kısmından harf harf yazdırılır) -->
        <div class="profile-bio" id="typewriter"></div>

        <!-- [DÜZENLE] ANA BUTONLAR ("Ben" ve "İletişim") -->
        <div class="links-wrapper">
            
            <!-- 1. Buton: Ben -->
            <a href="https://btylmz.com/ben" class="link-btn">
                <i class="fa-solid fa-user btn-icon-left"></i>
                <span>Ben</span>
                <i class="fa-solid fa-chevron-right btn-icon-right"></i>
            </a>

            <!-- 2. Buton: İletişim (mailto: kısmına kendi e-posta adresinizi yazın) -->
            <a href="mailto:btylmz8@gmail.com" class="link-btn">
                <i class="fa-solid fa-envelope btn-icon-left"></i>
                <span>İletişim</span>
                <i class="fa-solid fa-chevron-right btn-icon-right"></i>
            </a>

        </div>

        <!-- [DÜZENLE] YUVARLAK YOUTUBE VE SPOTIFY LİNKLERİ: href="" içine kendi linklerinizi yapıştırın -->
        <div class="social-icons">
            
            <!-- YouTube İkonu -->
            <a href="https://www.youtube.com/@btylmz" class="social-icon youtube" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>

            <!-- Spotify İkonu -->
            <a href="https://open.spotify.com/user/lpq8eu1de9nyc91cpsnokgis8?si=13d0ce40cacb4962" class="social-icon spotify" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
                <i class="fa-brands fa-spotify"></i>
            </a>

        </div>

        <!-- [DÜZENLE] ALT BİLGİ -->
        <div class="footer-text">
            © 2026 Tüm hakları saklıdır.
        </div>

    </main>

    <!-- ETKİLEŞİM SCRIPTİ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // [DÜZENLE] İsim altında daktilo efektiyle yazılacak metin:
            const bioText = "btylmz";
            const typeTarget = document.getElementById('typewriter');
            let index = 0;

            setTimeout(() => {
                function typeEffect() {
                    if (index < bioText.length) {
                        typeTarget.textContent += bioText.charAt(index);
                        index++;
                        setTimeout(typeEffect, 85);
                    }
                }
                typeEffect();
            }, 600);

            // 3D Buton Eğim Efekti (Sadece fare kullanılan bilgisayarlarda çalışır, mobilde kaymayı engeller)
            if (window.matchMedia("(hover: hover)").matches) {
                const buttons = document.querySelectorAll('.link-btn');

                buttons.forEach(btn => {
                    btn.addEventListener('mousemove', (e) => {
                        const rect = btn.getBoundingClientRect();
                        const x = e.clientX - rect.left - rect.width / 2;
                        const y = e.clientY - rect.top - rect.height / 2;
                        
                        const tiltX = (y / rect.height) * -10;
                        const tiltY = (x / rect.width) * 10;

                        btn.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale3d(1.02, 1.02, 1.02)`;
                    });

                    btn.addEventListener('mouseleave', () => {
                        btn.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
                    });
                });
            }
        });
    </script>

</body>
</html>
