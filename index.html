<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batu Yılmaz - Notlar & Projeler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html">
            <h1>Batu Yılmaz</h1>
        </a>
    </header>

    <main>
        <div id="posts-container">
            </div>
    </main>

    <script>
        // JSON dosyasını çekip kartları oluşturma
        fetch('posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                posts.forEach(post => {
                    const card = document.createElement('article');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <div class="post-date">${post.date}</div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-summary">${post.summary}</p>
                        <a href="post.html?id=${post.id}" class="read-more">Devamını Oku →</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                document.getElementById('posts-container').innerHTML = '<p>Yazılar yüklenirken bir hata oluştu.</p>';
                console.error('Hata:', error);
            });
    </script>
</body>
</html>
