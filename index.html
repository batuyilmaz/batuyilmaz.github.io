<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batu Yılmaz | Links</title>
    
    <!-- İkonlar için FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ========================================================
           GENEL TEMA VE HAREKETLİ ARKA PLAN
           ======================================================== */
        :root {
            --bg-dark: #020617;       
            --accent-cyan: #0ea5e9;    
            --accent-purple: #8b5cf6;  
            --card-glass: rgba(30, 41, 59, 0.4);
            --text-main: #f8fafc;      
            --text-muted: #94a3b8;     
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* 1. ANİMASYONLU NEON KÜRELER (Arka Plan Etkileşimi) */
        .background-orbs {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 15s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px; height: 400px;
            background: var(--accent-purple);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px; height: 300px;
            background: var(--accent-cyan);
            bottom: -50px; right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        /* ========================================================
           ORTA KART (Glassmorphism Arayüzü)
           ======================================================== */
        .linktree-container {
            width: 100%;
            max-width: 420px; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Profil Resmi (Dönen Çerçeve Animasyonu) */
        .profile-wrapper {
            position: relative;
            margin-bottom: 25px;
            animation: fadeInDown 1s ease forwards;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-dark);
            position: relative;
            z-index: 2;
        }

        .profile-wrapper::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-purple), var(--accent-cyan));
            border-radius: 50%;
            z-index: 1;
            background-size: 200% 200%;
            animation: spinGradient 4s linear infinite;
        }

        @keyframes spinGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
            animation: fadeInDown 1s ease forwards 0.2s;
            opacity: 0;
        }

        /* Daktilo Efekti İçin Kutu */
        .profile-bio {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            margin-bottom: 40px;
            height: 20px; /* Sabit yükseklik sıçramayı önler */
            opacity: 0;
            animation: fadeInDown 1s ease forwards 0.4s;
        }

        /* ========================================================
           3D ETKİLEŞİMLİ BUTONLAR
           ======================================================== */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            perspective: 1000px; /* 3D Efekti için Derinlik */
        }

        .link-btn {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.1s; /* JS 3D için transform hızlı olmalı */
            position: relative;
            transform-style: preserve-3d; /* 3D Yapıyı koru */
            
            /* Gecikmeli Yüklenme (Staggered Animation) */
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.6s ease forwards;
        }

        /* Her butona farklı gecikme süresi */
        .link-btn:nth-child(1) { animation-delay: 0.5s; }
        .link-btn:nth-child(2) { animation-delay: 0.6s; }
        .link-btn:nth-child(3) { animation-delay: 0.7s; }
        .link-btn:nth-child(4) { animation-delay: 0.8s; }
        .link-btn:nth-child(5) { animation-delay: 0.9s; }

        .link-btn i {
            font-size: 1.4rem;
            color: var(--text-muted);
            width: 40px;
            text-align: center;
            transition: color 0.3s ease, transform 0.3s ease;
            transform: translateZ(20px); /* 3D pop-out efekti */
        }

        .link-btn span {
            flex-grow: 1;
            text-align: center;
            padding-right: 40px; /* İkonu dengelemek için */
            transform: translateZ(10px); /* Metin de hafif öne çıkar */
        }

        /* Sadece fare hover olduğundaki aydınlanma (Eğim işini JS yapacak) */
        .link-btn:hover {
            border-color: rgba(14, 165, 233, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
                        0 0 20px rgba(14, 165, 233, 0.2);
            z-index: 10;
        }

        .link-btn:hover i {
            color: var(--accent-cyan);
            transform: translateZ(30px) scale(1.1); /* İkon daha da öne fırlar */
        }

        /* ========================================================
           SOSYAL MEDYA
           ======================================================== */
        .social-icons {
            display: flex;
            gap: 25px;
            margin-top: 40px;
            opacity: 0;
            animation: slideUpFade 0.6s ease forwards 1s;
        }

        .social-icon {
            color: var(--text-muted);
            font-size: 1.6rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-icon:hover {
            color: var(--text-main);
            transform: translateY(-5px) scale(1.2);
            text-shadow: 0 0 15px var(--accent-purple);
        }

        /* Animasyon Keyframeleri */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer-text {
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(148, 163, 184, 0.4);
            opacity: 0;
            animation: fadeInDown 1s ease forwards 1.2s;
        }

    </style>
</head>
<body>

    <!-- Arka Plan Animasyonlu Küreler -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="linktree-container">
        
        <!-- PROFİL -->
        <div class="profile-wrapper">
            <!-- Profil Fotoğrafını Buraya Ekle -->
            <img src="https://via.placeholder.com/150/0f172a/38bdf8?text=BY" alt="Batu Yılmaz" class="profile-pic">
        </div>
        
        <h1 class="profile-name">Batu Yılmaz</h1>
        <!-- Daktilo Efekti İçin Boş Kutu (İçeriği JS dolduracak) -->
        <div class="profile-bio" id="typewriter"></div>

        <!-- BAĞLANTI BUTONLARI -->
        <div class="links-wrapper">
            
            <a href="https://batuyilmaz.me" class="link-btn" target="_blank">
                <i class="fa-solid fa-code"></i>
                <span>Kişisel Web Sitem</span>
            </a>

            <a href="https://hickimse.com/nostraticnumbers" class="link-btn" target="_blank">
                <i class="fa-solid fa-diagram-project"></i>
                <span>Nostratic Numbers</span>
            </a>

            <a href="https://github.com/batuyilmaz" class="link-btn" target="_blank">
                <i class="fa-brands fa-github"></i>
                <span>GitHub Projeleri</span>
            </a>

            <a href="https://hickimse.com/outis" class="link-btn" target="_blank">
                <i class="fa-solid fa-feather"></i>
                <span>Outis</span>
            </a>

            <a href="mailto:iletisim@batuyilmaz.me" class="link-btn">
                <i class="fa-solid fa-envelope"></i>
                <span>Bana Ulaşın</span>
            </a>

        </div>

        <!-- SOSYAL MEDYA -->
        <div class="social-icons">
            <a href="#" class="social-icon" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="social-icon" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#" class="social-icon" target="_blank"><i class="fa-brands fa-reddit"></i></a>
        </div>

        <div class="footer-text">
            © 2026 Batu Yılmaz
        </div>
    </div>

    <!-- SİSTEM MOTORU: 3D EĞİM (TILT) VE DAKTİLO EFEKTİ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. DAKTİLO (TYPING) EFEKTİ
            const textToType = "Logistics Student | Maker | Researcher";
            const typeTarget = document.getElementById('typewriter');
            let i = 0;

            // Animasyonların bitmesini bekle ve yazmaya başla (1.2 saniye sonra)
            setTimeout(() => {
                function typeWriter() {
                    if (i < textToType.length) {
                        typeTarget.innerHTML += textToType.charAt(i);
                        i++;
                        setTimeout(typeWriter, 50); // Yazma hızı (50ms)
                    }
                }
                typeWriter();
            }, 1200);

            // 2. 3D BUTON EĞİM (TILT) EFEKTİ
            const buttons = document.querySelectorAll('.link-btn');

            buttons.forEach(btn => {
                // Fare butonun üzerinde hareket ettiğinde
                btn.addEventListener('mousemove', (e) => {
                    const rect = btn.getBoundingClientRect();
                    // Farenin butonun merkezine göre X ve Y koordinatlarını bul
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    
                    // Eğimi hesapla (Bölen sayı ne kadar küçükse o kadar çok eğilir)
                    const tiltX = (y / rect.height) * -20; 
                    const tiltY = (x / rect.width) * 20;

                    btn.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) scale3d(1.05, 1.05, 1.05)`;
                });

                // Fare butondan çıktığında sıfırla
                btn.addEventListener('mouseleave', () => {
                    btn.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
                });
            });
        });
    </script>

</body>
</html>
