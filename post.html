<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazı Detayı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html">
            <h1>Batu Yılmaz</h1>
        </a>
    </header>

    <main>
        <a href="index.html" class="back-btn">← Geri Dön</a>
        <article class="post-content-wrapper" id="post-content">
            <p>Yükleniyor...</p>
        </article>
    </main>

    <script>
        // URL'den ID'yi al
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        const contentDiv = document.getElementById('post-content');

        if (postId) {
            fetch('posts.json')
                .then(response => response.json())
                .then(posts => {
                    // ID'si eşleşen postu bul
                    const post = posts.find(p => p.id === postId);
                    
                    if (post) {
                        document.title = post.title; // Sekme başlığını güncelle
                        contentDiv.innerHTML = `
                            <div class="post-date">${post.date}</div>
                            <h1>${post.title}</h1>
                            <div class="post-body">${post.content}</div>
                        `;
                    } else {
                        contentDiv.innerHTML = '<h1>Yazı bulunamadı.</h1>';
                    }
                })
                .catch(error => {
                    contentDiv.innerHTML = '<p>Yazı yüklenirken bir hata oluştu.</p>';
                    console.error('Hata:', error);
                });
        } else {
            contentDiv.innerHTML = '<h1>Geçersiz bağlantı.</h1>';
        }
    </script>
</body>
</html>
