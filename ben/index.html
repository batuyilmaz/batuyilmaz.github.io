/* ---- Zaman: dokununca hızlanır, "geç" ile iptal olur ---- */
let boost = 1, bt = 0, pending = null, skipped = false, finalShown = false, curScene = 'giris';
const wait = ms => new Promise((res, rej) => {
  if (skipped) return rej(SK);
  const id = setTimeout(done, ms * boost);
  function done() {
    clearTimeout(id);
    if (pending === done) pending = null;
    if (skipped) rej(SK); else res();
  }
  pending = done;
});
const rush = () => { boost = .12; clearTimeout(bt); bt = setTimeout(() => { boost = 1; }, 1000); if (pending) pending(); };
const tween = async (ms, fn) => { let t = 0; while (t < 1) { await wait(16); t = Math.min(1, t + 16 / ms); fn(t); } };

const cleanups = [];
const onClean = f => cleanups.push(f);
const runClean = () => { while (cleanups.length) { try { cleanups.pop()(); } catch { /* sorun değil */ } } };

function doSkip() {
  if (skipped || finalShown) return;
  skipped = true;
  track('ben_skip', { scene: curScene });
  buzz(10);
  if (pending) pending();
}

/* ---- Yardımcılar ---- */
const mk = (tag, cls = '', txt = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
const line = (cls = '') => { const e = mk('div', 'line ' + cls); stage.appendChild(e); return e; };
const sync = el => { el.dataset.text = el.textContent; };
const mood = (a, b, c) => { root.style.setProperty('--o1', a); root.style.setProperty('--o2', b); root.style.setProperty('--o3', c); };
const CALM = ['#00b4d8', '#6366f1', '#10b981'];

async function type(el, text, speed = 55) {
  el.classList.add('typing');
  for (const ch of text) { el.textContent += ch; sync(el); await wait(speed * (.7 + Math.random() * .7)); }
  el.classList.remove('typing');
}
async function erase(el, speed = 22) {
  el.classList.add('typing');
  while (el.textContent.length) { el.textContent = el.textContent.slice(0, -1); sync(el); await wait(speed); }
  el.classList.remove('typing');
}
async function retype(el, text, hold = 1200, speed = 45) {
  if (el.textContent) await erase(el, 18);
  await type(el, text, speed);
  await wait(hold);
}
async function say(text, { cls = '', hold = 1300, mode = 'fade', speed = 55 } = {}) {
  const el = line(cls);
  await type(el, text, speed);
  await wait(hold);
  if (mode === 'erase') { await erase(el); el.remove(); }
  else if (mode === 'fade') { el.classList.add('out'); await wait(700); el.remove(); }
  return el;
}
async function clearStage(ms = 800) {
  const kids = [...stage.children];
  kids.forEach(k => k.classList.add('out'));
  await wait(ms);
  kids.forEach(k => k.remove());
}
/* ---- İmleç / dokunuş ---- */
const look = { x: .5, y: .5 };
let lastMove = 0;
const follow = e => {
  look.x = e.clientX / innerWidth; look.y = e.clientY / innerHeight; lastMove = performance.now();
  glow.style.setProperty('--gx', e.clientX + 'px');
  glow.style.setProperty('--gy', e.clientY + 'px');
};
addEventListener('pointermove', follow, { passive: true });
let touchMode = false, onTap = null;
addEventListener('pointerdown', e => {
  follow(e);
  if (finalShown || e.target.closest('a,button')) return;
  if (touchMode && onTap) { onTap(e.clientX, e.clientY); return; }
  rush(); buzz(6);
}, { passive: true });
addEventListener('keydown', e => {
  if (finalShown) return;
  if (e.key === 'Escape') { doSkip(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('a,button')) {
    if (touchMode && onTap) onTap(innerWidth / 2, innerHeight / 2); else rush();
  }
});
skipBtn.addEventListener('click', doSkip);

async function sceneTouch() {

    taps++;

    const w = mk('div', 'rw', WORDS[Math.floor(Math.random() * WORDS.length)]); w.style.left = x + 'px'; w.style.top = y + 'px';

  touchMode = true;

  const t0 = performance.now();
  while (taps < 5 && performance.now() - t0 < 12000) await wait(100);
  touchMode = false; onTap = null;
  if (taps >= 5) {
    await retype(cap, 'dokundun.', 1400);
    await retype(cap, 'ben de sana.', 2300);
  } else {
    await retype(cap, 'dokunmadın.', 1500);

}

  nameEl.addEventListener('click', cycle);

  /* Renk geçişi, ışık ve eğim (ana sayfadakiyle aynı) */
  const btns = [...card.querySelectorAll('.btn')];
  card.querySelectorAll('[data-mood]').forEach(el => {
    const c = el.dataset.mood.split(',');
    el.addEventListener('pointerenter', () => mood(c));
    el.addEventListener('pointerleave', () => mood(base));
  });
  if (!reduce) {
    let px = 0, py = 0, dirty = false;
    addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; if (!dirty) { dirty = true; requestAnimationFrame(() => {
      dirty = false;
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (px - r.left) + 'px');
      card.style.setProperty('--my', (py - r.top) + 'px');
      btns.forEach(b => { const q = b.getBoundingClientRect(); b.style.setProperty('--bx', (px - q.left) + 'px'); b.style.setProperty('--by', (py - q.top) + 'px'); });
    }); } }, { passive: true });
    if (matchMedia('(hover: hover)').matches) {
      btns.forEach(b => {
        b.addEventListener('mousemove', e => {
          const r = b.getBoundingClientRect();
          const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
          b.style.transform = `perspective(1000px) rotateX(${(y / r.height * -10).toFixed(2)}deg) rotateY(${(x / r.width * 10).toFixed(2)}deg) scale3d(1.02,1.02,1.02)`;
        });
        b.addEventListener('mouseleave', () => { b.style.transform = ''; });
      });
    }
  }

  /* Alt yazı: daktilo */
  if (reduce) {
    bio.textContent = 'btylmz.';
  } else {
    bio.textContent = '';
    (async () => {
      const PH = ['hâlâ buradasın.', 'gitmedin.', 'iyi.', 'ben de.', 'btylmz.'];
      await sleep(900);
      for (let i = 0; ; i++) {
        while (document.hidden) await sleep(400);
        for (const ch of PH[i % PH.length]) { bio.textContent += ch; await sleep(55 * (.7 + Math.random() * .6)); }
        await sleep(2300);
        while (bio.textContent) { bio.textContent = bio.textContent.slice(0, -1); await sleep(22); }
        await sleep(320);
      }
    })();
  }

  /* Sayaç */
  const LABELS = ['ömründen eksilen:', 'bu an bir daha dönmeyecek:', 'fânîlikten geçen:'];
  let li = 0;
  const fmt = n => n < 60 ? n + ' sn' : Math.floor(n / 60) + ' dk ' + (n % 60) + ' sn';
  $('timer').addEventListener('click', () => { $('timerLabel').textContent = LABELS[++li % LABELS.length]; });
  setInterval(() => { $('timerVal').textContent = fmt(Math.floor((performance.now() - T0) / 1000)); }, 1000);

  track('ben_final', { via });
  if (via === 'complete') buzz([14, 50, 14]);
}

/* ---- Başlat ---- */
(async () => {
  if (reduce) { showFinal('reduced'); return; }

  stage.innerHTML = '';
  skipBtn.hidden = false;
  startFragments();
  let via = 'complete';
  const list = seen ? [['kisa', sceneShort]] : FULL;
  if (seen) via = 'short';
  if (!seen) {
    setTimeout(() => hint.classList.add('show'), 7000);
    setTimeout(() => hint.classList.remove('show'), 13000);
  }
  try {
    for (const [n, fn] of list) {
      curScene = n;
      track('ben_scene', { scene: n });
      await fn();
    }
  } catch (e) {
    if (e === SK) via = 'skip';
    else { console.error(e); via = 'error'; }
  }
  showFinal(via);
})();
})();
</script>
</body>
</html>
