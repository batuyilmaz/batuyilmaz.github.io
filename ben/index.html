.door .light{position:absolute;inset:0;background:linear-gradient(180deg,#fff,#bae6fd 40%,#38bdf8);opacity:0;transition:opacity 1.6s}
.door .leaf{position:absolute;inset:0;transform-origin:left center;border:2px solid rgba(255,255,255,.55);border-radius:6px 6px 0 0;background:#0b1226;transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.door .leaf::after{content:'';position:absolute;right:10px;top:52%;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7)}
.door.open .leaf{transform:rotateY(-78deg)}
.door.open .light{opacity:.95}
.door.open .frame{box-shadow:0 0 70px rgba(186,230,253,.55)}

/* ---- Dokunuş ---- */
.rip{position:fixed;z-index:20;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--ac);pointer-events:none;animation:rip 1.2s ease-out forwards}
.rw{position:fixed;z-index:21;pointer-events:none;font-size:1rem;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.6);animation:rwf 1.6s ease-out forwards}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(11);opacity:0}}
@keyframes rwf{0%{opacity:0;transform:translate(-50%,-30%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%)}}

@keyframes lett{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,4px)}}
@keyframes jit{0%{transform:translate(2px,0)}50%{transform:translate(-3px,1px)}100%{transform:translate(1px,-1px)}}
@keyframes up{0%{opacity:0;transform:translateY(40px) rotate(var(--r));filter:blur(6px)}20%{opacity:.9;filter:none}80%{opacity:.7}100%{opacity:0;transform:translateY(-120px) rotate(var(--r));filter:blur(6px)}}
@keyframes fin{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@media (max-height:560px){.ring{display:none}}
</style>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const stage = $('stage'), hint = $('hint'), glow = $('glow'), skipBtn = $('skip'), voidEl = $('void');
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T0 = performance.now();
const KEY = 'btylmz.ben';
const SK = { skip: true };

const track = (n, p) => window.track && window.track(n, p);
const buzz = p => window.buzz && window.buzz(p);
const isLite = () => root.classList.contains('lite');
const seen = (() => { try { return sessionStorage.getItem(KEY) === '1'; } catch { return false; } })();
const markSeen = () => { try { sessionStorage.setItem(KEY, '1'); } catch { /* özel mod vb. */ } };

/* ---- Sekme başlığı ---- */
let cur = document.title;
const setTitle = t => { cur = t; if (!document.hidden) document.title = t; };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { document.title = 'gitme.'; return; }
  document.title = 'geri geldin.';
  setTimeout(() => { if (!document.hidden) document.title = cur; }, 1600);
});

/* ---- Zaman: dokununca hızlanır, "geç" ile iptal olur ---- */
let boost = 1, bt = 0, pending = null, skipped = false, finalShown = false, curScene = 'giris';
const wait = ms => new Promise((res, rej) => {
  if (skipped) return rej(SK);
  const id = setTimeout(done, ms * boost);
  function done() {
    clearTimeout(id);
    if (pending === done) pending = null;
    if (skipped) rej(SK); else res();
  }
  pending = done;
});
const rush = () => { boost = .12; clearTimeout(bt); bt = setTimeout(() => { boost = 1; }, 1000); if (pending) pending(); };
const tween = async (ms, fn) => { let t = 0; while (t < 1) { await wait(16); t = Math.min(1, t + 16 / ms); fn(t); } };

const cleanups = [];
const onClean = f => cleanups.push(f);
const runClean = () => { while (cleanups.length) { try { cleanups.pop()(); } catch { /* sorun değil */ } } };

function doSkip() {
  if (skipped || finalShown) return;
  skipped = true;
  track('ben_skip', { scene: curScene });
  buzz(10);
  if (pending) pending();
}

/* ---- Yardımcılar ---- */
const mk = (tag, cls = '', txt = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; };
const line = (cls = '') => { const e = mk('div', 'line ' + cls); stage.appendChild(e); return e; };
const sync = el => { el.dataset.text = el.textContent; };
const mood = (a, b, c) => { root.style.setProperty('--o1', a); root.style.setProperty('--o2', b); root.style.setProperty('--o3', c); };
const CALM = ['#00b4d8', '#6366f1', '#10b981'];

async function type(el, text, speed = 55) {
  el.classList.add('typing');
  for (const ch of text) { el.textContent += ch; sync(el); await wait(speed * (.7 + Math.random() * .7)); }
  el.classList.remove('typing');
}
async function erase(el, speed = 22) {
  el.classList.add('typing');
  while (el.textContent.length) { el.textContent = el.textContent.slice(0, -1); sync(el); await wait(speed); }
  el.classList.remove('typing');
}
async function retype(el, text, hold = 1200, speed = 45) {
  if (el.textContent) await erase(el, 18);
  await type(el, text, speed);
  await wait(hold);
}
async function say(text, { cls = '', hold = 1300, mode = 'fade', speed = 55 } = {}) {
  const el = line(cls);
  await type(el, text, speed);
  await wait(hold);
  if (mode === 'erase') { await erase(el); el.remove(); }
  else if (mode === 'fade') { el.classList.add('out'); await wait(700); el.remove(); }
  return el;
}
async function clearStage(ms = 800) {
  const kids = [...stage.children];
  kids.forEach(k => k.classList.add('out'));
  await wait(ms);
  kids.forEach(k => k.remove());
}
/* ---- İmleç / dokunuş ---- */
const look = { x: .5, y: .5 };
let lastMove = 0;
const follow = e => {
  look.x = e.clientX / innerWidth; look.y = e.clientY / innerHeight; lastMove = performance.now();
  glow.style.setProperty('--gx', e.clientX + 'px');
  glow.style.setProperty('--gy', e.clientY + 'px');
};
addEventListener('pointermove', follow, { passive: true });
let touchMode = false, onTap = null;
addEventListener('pointerdown', e => {
  follow(e);
  if (finalShown || e.target.closest('a,button')) return;
  if (touchMode && onTap) { onTap(e.clientX, e.clientY); return; }
  rush(); buzz(6);
}, { passive: true });
addEventListener('keydown', e => {
  if (finalShown) return;
  if (e.key === 'Escape') { doSkip(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('a,button')) {
    if (touchMode && onTap) onTap(innerWidth / 2, innerHeight / 2); else rush();
  }
});
skipBtn.addEventListener('click', doSkip);

/* ---- Ölü diller ve kavram fısıltıları (arka planda) ---- */
const FRAGS = [
  '𐰇𐰔 • öz (cevher)', 'نَفْس • nefs (soluk)', 'فَنَاء • fenâ (hiçlik)', 'مَنْ عَرَفَ نَفْسَهُ • kendini bilen',
  '𐱅𐰃𐰤 • tin (ruh)', 'memento mori', 'الْمَوْجُود • el-mevcûd', 'gnothi seauton',
  'أَنَا • enâniyet (ego)', 'hiç • 0x00'
];
function startFragments() {
  if (reduce) return;
  let k = 0;
  const iv = setInterval(() => {
    if (document.hidden || isLite()) return;
    const f = mk('div', 'frag', FRAGS[k++ % FRAGS.length]);
    f.style[Math.random() > .5 ? 'left' : 'right'] = (4 + Math.random() * 10) + 'vw';
    f.style.top = (15 + Math.random() * 70) + 'vh';
    f.addEventListener('animationend', () => f.remove());
    voidEl.appendChild(f);
  }, 3800);
  onClean(() => clearInterval(iv));
}

/* ==========================================================================
   Sahneler
   ========================================================================== */

/* 1 — giriş */
async function intro() {
  setTitle('ben');
  await wait(1100);
  await say('merhaba.', { hold: 900, mode: 'erase' });
  await say('hayır, böyle başlamamalıydım.', { hold: 1100, mode: 'erase' });
  await say('buraya “ben kimim” diye geldin.', { hold: 1500 });
  setTitle('ben?');
  await say('sana bir şey söyleyecektim.', { hold: 1300, mode: 'keep' });
  await say('. . .', { speed: 420, hold: 1500, mode: 'keep' });
  await say('unuttum.', { hold: 1700, mode: 'keep' });
  await say('ama sen geldin. bu da bir şey.', { cls: 'small', hold: 2400, mode: 'keep' });
  await clearStage();
}

/* 2 — ad: ünlüsüz isim */
async function sceneName() {
  setTitle('btylmz');
  mood('#f59e0b', '#6366f1', '#ec4899');
  const big = line('big glitch');
  await wait(400);
  await type(big, 'btylmz', 130);
  await wait(900);
  const cap = line('small');
  await retype(cap, 'içinde tek bir ünlü yok.', 1700);
  await retype(cap, 'yalnızca sessiz harflerden bir ad.', 2000);
  await retype(cap, 'sesi sen ver.', 2000);
  await retype(cap, 'sen vermezsen ben yokum.', 2600);
  await clearStage();
}

/* 3 — tekrar: bir kelime anlamını yitirir */
async function sceneRepeat() {
  setTitle('ben ben ben');
  mood('#8b5cf6', '#ec4899', '#f59e0b');
  const cap = line('small');
  await retype(cap, 'bir kelimeyi yeterince çok tekrar edersen', 1500);
  await retype(cap, 'anlamını yitirir.', 1300);
  const box = mk('div', 'mantra');
  stage.appendChild(box);
  const words = [];
  const rotten = ['bne', 'nbe', 'neb', 'b·n', 'e?n', 'ben?', 'b e n', '…', 'nen', 'bbb', 'be'];
  for (let i = 0; i < 52; i++) {
    const w = mk('span', '', 'ben');
    box.appendChild(w);
    words.push(w);
    if (i > 8) {
      const k = Math.floor(Math.random() * words.length);
      words[k].textContent = rotten[Math.floor(Math.random() * rotten.length)];
      words[k].classList.add('rot');
    }
    await wait(Math.max(30, 130 - i * 2));
  }
  await wait(900);
  await retype(cap, 'ben. ben. ben.', 1100);
  await retype(cap, 'neydi bu?', 2200);
  await clearStage();
}

/* 4 — yankı */
async function sceneEcho() {
  setTitle('…mu?');
  mood('#0ea5e9', '#6366f1', '#22d3ee');
  const parts = ['kimse yok mu?', 'yok mu?', 'mu?', '?'];
  for (let i = 0; i < parts.length; i++) {
    const el = line('');
    el.style.fontSize = `calc(clamp(1.25rem,5.4vw,1.9rem) * ${1 - i * .17})`;
    el.style.color = `rgba(248,250,252,${1 - i * .24})`;
    await type(el, parts[i], 60);
    await wait(i ? 450 : 900);
  }
  await wait(900);
  const cap = line('small');
  await retype(cap, 'yankı: kendi sesinin sana geri gelmesi.', 2400);
  await retype(cap, 'bu sayfa da öyle.', 2400);
  await clearStage();
}

/* 5 — kapı */
async function sceneDoor() {
  setTitle('kapı');
  mood('#38bdf8', '#6366f1', '#0ea5e9');
  const door = mk('div', 'door');
  door.innerHTML = '<div class="frame"><div class="light"></div></div><div class="leaf"></div>';
  stage.appendChild(door);
  const cap = line('small');
  await wait(600);
  await retype(cap, 'bir kapı var.', 1600);
  await retype(cap, 'açma.', 2400);
  door.classList.add('open');
  buzz(20);
  await wait(1500);
  await retype(cap, 'açtın.', 1500);
  await retype(cap, 'içeride hiçbir şey yok.', 2100);
  await retype(cap, 'ama ışık var.', 1700);
  await retype(cap, 'içeriden değil, ekranından geliyor.', 3000);
  await clearStage();
}

/* 4 — yükleme */
async function sceneLoad() {
  setTitle('yükleniyor…');
  mood('#38bdf8', '#8b5cf6', '#22d3ee');
  const cap = line('small'), wrap = mk('div', 'loader'), bar = mk('div', 'bar'), fill = mk('i'), pct = mk('b', 'pct', '0%');
  bar.appendChild(fill); wrap.append(bar, pct); stage.appendChild(wrap);
  const set = v => { fill.style.width = v + '%'; pct.textContent = Math.round(v) + '%'; };
  await retype(cap, 'ben yükleniyor', 500);
  await tween(4200, t => set(t < .6 ? t / .6 * 70 : 70 + Math.pow((t - .6) / .4, 2) * 29));
  await retype(cap, 'takıldı.', 1300);
  await retype(cap, 'bazı şeyler %99’da kalır.', 2000);
  await retype(cap, 'son yüzde sende.', 2300);
  wrap.classList.add('jit');
  await tween(1100, t => set(99 * (1 - t)));
  wrap.classList.remove('jit');
  await retype(cap, 'başa döndük.', 1500);
  await clearStage();
}

/* 5 — zaman */
async function sceneTime() {
  setTitle('…');
  mood('#10b981', '#0ea5e9', '#6366f1');
  const cap = line('small');
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
  await retype(cap, `şu an saat ${hh}:${mm}.`, 1800);
  await retype(cap, 'bunu okurken geçti.', 1700);
  const big = line('big num');
  const upd = () => { big.textContent = Math.floor((performance.now() - T0) / 1000) + ' saniye'; };
  upd();
  const iv = setInterval(upd, 250);
  onClean(() => clearInterval(iv));
  await retype(cap, 'sen geldiğinden beri', 3000);
  await retype(cap, 'geçen süre bu.', 1600);
  await retype(cap, 'benim saatim yok. hep aynı an.', 2600);
  clearInterval(iv);
  await clearStage();
}

/* 6 — sorular */
async function sceneQuestions() {
  setTitle('?');
  mood('#8b5cf6', '#06b6d4', '#f43f5e');
  const layer = mk('div', 'drift');
  document.body.appendChild(layer);
  onClean(() => layer.remove());
  ['neden buradasın?', 'ne bulmayı umuyordun?', 'bir butona mı bastın?', 'hangisine?', 'ben kimdim?', 'peki ya sen?'].forEach((q, i) => setTimeout(() => {
    if (skipped) return;
    const el = mk('div', 'q', q);
    el.style.left = (5 + Math.random() * 22) + 'vw';
    el.style.top = (12 + i * 12 + Math.random() * 4) + 'vh';
    el.style.setProperty('--r', (Math.random() * 8 - 4) + 'deg');
    layer.appendChild(el);
  }, i * 700));
  setTimeout(() => layer.remove(), 12500);
  await wait(5200);
  await say('o buton bendim.', { hold: 2600, mode: 'keep' });
  await clearStage();
}

/* 7 — göz */
async function sceneEye() {
  setTitle('bakıyorsun');
  mood('#f472b6', '#6366f1', '#38bdf8');
  const eye = mk('div', 'eye'), iris = mk('div', 'iris');
  eye.appendChild(iris); stage.appendChild(eye);
  const cap = line('');
  let alive = true;
  onClean(() => { alive = false; });
  requestAnimationFrame(() => requestAnimationFrame(() => eye.classList.add('open')));
  (function loop() {
    if (!alive) return;
    const n = performance.now();
    if (n - lastMove > 2200) { look.x = .5 + Math.sin(n / 900) * .4; look.y = .5 + Math.cos(n / 1300) * .35; }
    iris.style.transform = `translate(${(look.x - .5) * 68}px,${(look.y - .5) * 28}px)`;
    requestAnimationFrame(loop);
  })();
  const blink = () => { eye.classList.add('blink'); setTimeout(() => eye.classList.remove('blink'), 150); };
  await wait(1500);
  await retype(cap, 'bakıyorsun.', 1700);
  cap.classList.add('glitch');
  await retype(cap, 'bakılıyorsun.', 2300);
  blink(); await wait(250); blink();
  await retype(cap, 'göz kırptım.', 1300);
  cap.classList.remove('glitch');
  await retype(cap, 'sen de kırp.', 2000);
  eye.classList.add('shut');
  await wait(800);
  alive = false;
  await clearStage();
}

/* 8a — sessizlik */
async function sceneSilence() {
  setTitle('·');
  mood('#0b1226', '#111827', '#0f172a');
  await say('şimdi sessiz kalacağım.', { hold: 1200, mode: 'erase' });
  const el = line('');
  el.classList.add('typing');
  await wait(6500);
  el.remove();
  mood('#00b4d8', '#6366f1', '#10b981');
  setTitle('…');
  await say('duydun mu?', { hold: 1800 });
  await say('ben de duymadım.', { hold: 1700 });
  await say('sessizlik de bir cümledir.', { cls: 'small', hold: 2400 });
  await clearStage();
}

/* 8b — dokunuş */
async function sceneTouch() {
  setTitle('dokun');
  mood('#10b981', '#06b6d4', '#6366f1');
  const WORDS = ['hiç', 'var', 'yok', 'sen', 'ben', 'şimdi', 'burada'];
  const cap = line('');
  await type(cap, 'ekrana dokun.', 70);
  let taps = 0;
  onTap = (x, y) => {
    taps++;
    const r = mk('div', 'rip'); r.style.left = x + 'px'; r.style.top = y + 'px';
    const w = mk('div', 'rw', WORDS[Math.floor(Math.random() * WORDS.length)]); w.style.left = x + 'px'; w.style.top = y + 'px';
    document.body.append(r, w);
    setTimeout(() => { r.remove(); w.remove(); }, 1700);
    buzz(10);
  };
  touchMode = true;
  onClean(() => { touchMode = false; onTap = null; });
  const t0 = performance.now();
  while (taps < 5 && performance.now() - t0 < 12000) await wait(100);
  touchMode = false; onTap = null;
  if (taps >= 5) {
    await retype(cap, 'dokundun.', 1400);
    await retype(cap, 'ben de sana.', 2300);
  } else {
    await retype(cap, 'dokunmadın.', 1500);
    await retype(cap, 'o da bir cevap.', 2300);
  }
  await clearStage();
}

/* 8 — hata */
async function sceneError() {
  setTitle('HATA');
  mood('#ef4444', '#7c3aed', '#f59e0b');
  const big = line('big glitch err'), sm = line('small');
  await wait(600);
  stage.classList.add('shake');
  buzz([30, 40, 30]);
  setTimeout(() => stage.classList.remove('shake'), 700);
  await type(big, 'HATA 404', 45);
  await retype(sm, 'ben bulunamadı.', 1900);
  await retype(sm, '…bulundu.', 1200);
  big.classList.remove('err');
  await retype(big, 'buradayım.', 800);
  await retype(sm, 'sadece başka yerdeyim.', 2500);
  await clearStage();
}

/* 9 — son sözler */
async function sceneEnd() {
  setTitle('ben');
  mood(...CALM);
  await say('burada bir şey anlatacaktım.', { hold: 1400 });
  await say('anlattım.', { hold: 1300 });
  await say('anlamadıysan doğru yerdesin.', { hold: 1700 });
  await say('ben de tam anlamış değilim.', { hold: 1500, mode: 'keep' });
  await say('ama buradayım.', { cls: 'small', hold: 2200, mode: 'keep' });
  await clearStage(900);
}

/* Aynı oturumda tekrar gelenler için kısa sürüm */
async function sceneShort() {
  setTitle('ben');
  await wait(700);
  await say('yine mi geldin.', { hold: 1100 });
  await say('bir kez anlatmıştım.', { cls: 'small', hold: 1300 });
  await say('anlatmadım sayılır.', { hold: 1500 });
}

const FULL = [
  ['giris', intro], ['ad', sceneName], ['ben', sceneRepeat], ['yanki', sceneEcho], ['kapi', sceneDoor],
  ['yukleme', sceneLoad], ['zaman', sceneTime], ['sessizlik', sceneSilence], ['sorular', sceneQuestions],
  ['goz', sceneEye], ['dokun', sceneTouch], ['hata', sceneError], ['son', sceneEnd]
];

/* ==========================================================================
   Son ekran
   ========================================================================== */
function showFinal(via) {
  if (finalShown) return;
  finalShown = true;
  skipped = true;
  runClean();
  markSeen();
  hint.classList.remove('show');
  skipBtn.hidden = true;
  voidEl.textContent = '';
  stage.textContent = '';
  stage.removeAttribute('aria-hidden');
  setTitle('ben | btylmz');
  mood(...CALM);

  const f = mk('div', 'final');
  const ring = mk('div', 'ring'); ring.setAttribute('aria-hidden', 'true'); ring.appendChild(mk('span'));
  const name = mk('p', 'line big glitch', 'Batu Yılmaz'); name.dataset.text = 'Batu Yılmaz';
  const whisper = mk('p', 'whisper', 'btylmz');
  const links = mk('div', 'links');
  const home = mk('a', 'btn', 'Ana sayfa'); home.href = '/'; home.dataset.track = 'ben_home'; home.style.animationDelay = '.6s';
  const mail = mk('a', 'btn', 'Yaz bana'); mail.href = 'mailto:btylmz8@gmail.com'; mail.dataset.track = 'ben_mail'; mail.style.animationDelay = '.75s';
  const again = mk('button', 'btn', 'Baştan'); again.type = 'button'; again.dataset.track = 'ben_replay'; again.style.animationDelay = '.9s';
  links.append(home, mail, again);
  f.append(ring, name, whisper, links);
  stage.appendChild(f);

  again.addEventListener('click', () => {
    try { sessionStorage.removeItem(KEY); } catch { /* özel mod vb. */ }
    setTimeout(() => location.reload(), 120);
  });
  ring.addEventListener('click', () => {
    stage.classList.add('shake');
    buzz([16, 40, 16]);
    whisper.textContent = 'hâlâ buradasın.';
    setTimeout(() => stage.classList.remove('shake'), 650);
  });

  const msgs = ['hâlâ buradasın.', 'gitmedin.', 'iyi.', 'ben de.', 'btylmz'];
  let k = 0;
  if (!reduce) {
    setInterval(() => {
      whisper.classList.add('swap');
      setTimeout(() => { whisper.textContent = msgs[k++ % msgs.length]; whisper.classList.remove('swap'); }, 600);
    }, 4200);
  }
  track('ben_final', { via });
  if (via === 'complete') buzz([14, 50, 14]);
}

/* ---- Başlat ---- */
(async () => {
  if (reduce) { showFinal('reduced'); return; }

  stage.innerHTML = '';
  skipBtn.hidden = false;
  startFragments();
  let via = 'complete';
  const list = seen ? [['kisa', sceneShort]] : FULL;
  if (seen) via = 'short';
  if (!seen) {
    setTimeout(() => hint.classList.add('show'), 7000);
    setTimeout(() => hint.classList.remove('show'), 13000);
  }
  try {
    for (const [n, fn] of list) {
      curScene = n;
      track('ben_scene', { scene: n });
      await fn();
    }
  } catch (e) {
    if (e === SK) via = 'skip';
    else { console.error(e); via = 'error'; }
  }
  showFinal(via);
})();
})();
</script>
